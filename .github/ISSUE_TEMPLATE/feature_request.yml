name: 功能建议
description: 提出一个新能力或改进方向
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述场景与痛点，而不是直接给方案
      placeholder: 导出长诗时纸片太小，几乎拖不动……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 可以是具体交互，也可以是一个方向
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 原文排版
        - 创作区交互
        - 导出与画布
        - 左栏与设置
        - 性能与工程
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 已查看 docs/PRD.md 的路线图，确认不在已明确推迟的范围内
          required: true
